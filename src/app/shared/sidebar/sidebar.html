<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-header">
    <a routerLink="/" class="sidebar-logo">
      <svg width="26" height="30" viewBox="0 0 28 32" fill="none">
        <path d="M14 0L28 6V16C28 24 22 30 14 32C6 30 0 24 0 16V6L14 0Z" fill="#002b49"/>
        <path d="M10 16L13 19L18 13" stroke="#0070ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sidebar-logo-text font-display">SENTINEL</span>
    </a>
    <div class="sidebar-role-chip font-mono">{{ role === 'admin' ? 'ADMIN' : 'EMPLOYEE' }}</div>
  </div>

  <!-- Nav Items -->
  <nav class="sidebar-nav">
    <span class="sidebar-section-label font-mono">NAVIGATION</span>
    <a
      *ngFor="let item of items"
      class="sidebar-nav-item"
      [class.active]="activeId === item.id"
      (click)="select(item.id)"
    >
      <span class="sidebar-item-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <!-- User Profile -->
  <div class="sidebar-profile">
    <div class="profile-avatar font-display">
      {{ userName.charAt(0) }}{{ userName.split(' ')[1]?.charAt(0) || '' }}
    </div>
    <div class="profile-info">
      <div class="profile-name font-display">{{ userName }}</div>
      <div class="profile-role font-mono">{{ userRole }}</div>
    </div>
    <a routerLink="/auth" class="logout-btn" title="Log Out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </a>
  </div>
</aside>
