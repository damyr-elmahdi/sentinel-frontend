<nav class="navbar-root" [class.navbar-solid]="!transparent" [class.navbar-transparent]="transparent" [class.navbar-scrolled]="scrolled">
  <div class="navbar-inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar-logo">
      <svg width="28" height="32" viewBox="0 0 28 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 0L28 6V16C28 24 22 30 14 32C6 30 0 24 0 16V6L14 0Z" fill="#001629"/>
        <path d="M14 4L24 8.5V16C24 22 20 27 14 28.5C8 27 4 22 4 16V8.5L14 4Z" fill="#002b49"/>
        <path d="M10 16L13 19L18 13" stroke="#0059bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="16" r="1.5" fill="#0070ea"/>
      </svg>
      <span class="navbar-logo-text">SENTINEL</span>
    </a>

    <!-- Desktop Nav -->
    <ul class="navbar-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Home</a></li>
      <li><a href="#about" class="nav-link">About</a></li>
      <li><a href="#partners" class="nav-link">Partners</a></li>
      <li><a href="#contact" class="nav-link">Contact</a></li>
    </ul>

    <!-- Auth Buttons -->
    <div class="navbar-actions">
      <a routerLink="/auth" class="btn-ghost" style="font-size:13px;padding:7px 14px;">Sign In</a>
      <a routerLink="/auth" class="btn-primary" style="font-size:13px;padding:7px 14px;">Log In</a>
    </div>

    <!-- Mobile Hamburger -->
    <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Toggle menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path *ngIf="!menuOpen" d="M2 5h16M2 10h16M2 15h16" stroke="#191c1e" stroke-width="1.5" stroke-linecap="round"/>
        <path *ngIf="menuOpen" d="M4 4l12 12M16 4L4 16" stroke="#191c1e" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" *ngIf="menuOpen">
    <a routerLink="/" class="mobile-nav-link" (click)="toggleMenu()">Home</a>
    <a href="#about" class="mobile-nav-link" (click)="toggleMenu()">About</a>
    <a href="#partners" class="mobile-nav-link" (click)="toggleMenu()">Partners</a>
    <a href="#contact" class="mobile-nav-link" (click)="toggleMenu()">Contact</a>
    <div style="display:flex;gap:8px;padding:0 16px 16px;">
      <a routerLink="/auth" class="btn-ghost" style="flex:1;justify-content:center;" (click)="toggleMenu()">Sign In</a>
      <a routerLink="/auth" class="btn-primary" style="flex:1;justify-content:center;" (click)="toggleMenu()">Log In</a>
    </div>
  </div>
</nav>
